    <script>
        function chMon() {
            // Get the checkbox
            var monday = document.getElementById("monday");
            // Get the output text
            var Monday = document.getElementById("Monday");
            // If the checkbox is checked, display the output text
            if (monday.checked == true){
                Monday.style.display = "block";
            } else {
                Monday.style.display = "none";
            }
        }
